<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7FDBCA"/>
      <stop offset="50%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7FDBCA;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#7FDBCA;stop-opacity:0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <ellipse cx="980" cy="40" rx="260" ry="140" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="180" cy="280" rx="220" ry="120" fill="#58a6ff" opacity="0.12" filter="url(#soft)"/>

  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M90 70 h40 l16 16 v48 l-16 16 h-40 l-16 -16 v-48 z"/>
    <path d="M106 94 l14 14 -14 14"/>
    <path d="M128 94 l-14 14 14 14"/>
  </g>

  <text x="170" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#accent)">Ian</text>
  <text x="172" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" letter-spacing="4">COMPUTER SCIENCE STUDENT</text>

  <g font-family="Consolas, Monaco, monospace" font-size="18">
    <rect x="170" y="190" width="78" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="209" y="213" fill="#7FDBCA" text-anchor="middle">Java</text>
    <rect x="262" y="190" width="130" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="327" y="213" fill="#58a6ff" text-anchor="middle">Spring</text>
    <rect x="406" y="190" width="100" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="456" y="213" fill="#bc8cff" text-anchor="middle">Python</text>
    <rect x="520" y="190" width="70" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="555" y="213" fill="#f0883e" text-anchor="middle">JS</text>
  </g>

  <g font-family="Consolas, Monaco, monospace" font-size="16" fill="#8b949e">
    <text x="700" y="90" opacity="0.9">&gt; building bots &amp; automations_</text>
    <text x="700" y="130" opacity="0.75">$ git commit -m "ship it"</text>
    <text x="700" y="170" opacity="0.6">status: <tspan fill="#7FDBCA">online</tspan></text>
  </g>

  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>
</svg>
